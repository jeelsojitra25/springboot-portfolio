<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${meta != null ? meta.title : 'Jeel Sojitra | Portfolio'}">Jeel Sojitra | Portfolio</title>
    <meta name="description" th:content="${meta != null ? meta.description : 'Software developer portfolio'}"/>
    <link rel="canonical" th:href="${meta != null ? meta.canonicalUrl : '/'}"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" th:content="${meta != null ? meta.title : 'Jeel Sojitra | Portfolio'}"/>
    <meta property="og:description" th:content="${meta != null ? meta.description : 'Software developer portfolio'}"/>
    <meta property="og:url" th:content="${meta != null ? meta.canonicalUrl : '/'}"/>
    <meta property="og:image" th:if="${meta != null and meta.imageUrl != null}" th:content="${meta != null ? meta.imageUrl : null}"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" th:content="${meta != null ? meta.title : 'Jeel Sojitra | Portfolio'}"/>
    <meta name="twitter:description" th:content="${meta != null ? meta.description : 'Software developer portfolio'}"/>
    <meta name="twitter:image" th:if="${meta != null and meta.imageUrl != null}" th:content="${meta != null ? meta.imageUrl : null}"/>
    <link rel="stylesheet" th:href="@{/style.css}">
    <th:block th:if="${analyticsSnippet}" th:utext="${analyticsSnippet}"></th:block>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
    <div class="container header-inner">
        <div class="brand">
            <a class="brand-title" th:href="@{/}">Jeel Sojitra</a>
            <span class="brand-tagline">Software Developer</span>
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
            <a th:href ="@{/}">Home</a>
            <a th:href ="@{/about}">About</a>
            <a th:href ="@{/project}">Projects</a>
            <a th:href ="@{/contact}">Contact</a>
        </nav>
    </div>
</header>
<main id="main-content" class="container" th:replace ="${content}"></main>
<footer class="site-footer">
    <div class="container footer-inner">
        <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Jeel Sojitra. All rights reserved.</p>
    </div>
</footer>
</body>
</html>

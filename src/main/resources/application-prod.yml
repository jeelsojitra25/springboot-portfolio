spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

analytics:
  enabled: ${ANALYTICS_ENABLED:false}
  provider: ${ANALYTICS_PROVIDER:none}
  script-host: ${ANALYTICS_HOST:https://plausible.io}
  site-id: ${ANALYTICS_SITE_ID:}
